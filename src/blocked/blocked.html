<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - IP Kill Switch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#f44336" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1>Access Denied</h1>
    <p class="subtitle">Your IP address does not match the allowed list for this domain.</p>

    <div class="details-card">
      <div class="detail-row">
        <span class="label">Target Domain:</span>
        <span class="value" id="target-domain">Detecting...</span>
      </div>
      <div class="detail-row">
        <span class="label">Your Current IP:</span>
        <span class="value" id="current-ip">Checking...</span>
      </div>
      <div class="detail-row">
        <span class="label">Allowed IPs:</span>
        <span class="value" id="allowed-ips">Loading...</span>
      </div>
    </div>

    <div class="actions">
      <button id="retry-btn" class="primary-btn">Check Again & Retry</button>
      <button id="settings-btn" class="secondary-btn">Open Settings</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
